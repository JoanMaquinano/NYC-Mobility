name: CI

on:
  pull_request:
    branches:
      - feature/staging-part-2
    paths:
      - "**/*.py"
      - "**/*.sql"
      - "**/*.yml"
      - "**/*.yaml"
      - "**/*.toml"
      - ".sqlfluff"
      - ".pre-commit-config.yaml"
      - ".flake8"
      - ".github/workflows/**"
  push:
    branches:
      - feature/staging-part-2
    paths:
      - "**/*.py"
      - "**/*.sql"
      - "**/*.yml"
      - "**/*.yaml"
      - "**/*.toml"
      - ".sqlfluff"
      - ".pre-commit-config.yaml"
      - ".flake8"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate project
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "black==24.10.0" \
            "flake8==7.1.1" \
            "isort==5.13.2" \
            "nbqa==1.9.1" \
            "nbstripout==0.7.1" \
            "pytest==8.3.3" \
            "sqlfluff[databricks]==3.3.1"

      - name: Validate required project structure
        run: |
          test -d src
          test -d tests
          test -d docs
          test -f databricks.yml
          find src tests -type f -name "*.sql" -print -quit | grep -q .

      - name: Check Python formatting
        run: python -m black --check src tests
      
      - name: Check Python imports
        run: python -m isort --check-only src tests
      
      - name: Lint Python
        run: python -m flake8 src tests

      - name: Validate SQL syntax and formatting
        run: python -m sqlfluff lint --config .sqlfluff src tests

      - name: Run Python tests
        run: |
          if find tests -type f \( -name "test_*.py" -o -name "*_test.py" \) -print -quit | grep -q .; then
            pytest
          else
            echo "No pytest-discoverable Python tests found; SQL quality checks cover the current test suite."
          fi

      - name: Check whitespace
        run: git diff --check

      - name: Set up Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate Databricks bundle
        run: databricks bundle validate -t dev
