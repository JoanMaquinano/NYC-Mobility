name: PR Checks

on:
  pull_request:
    branches:
      - main
      - feature/staging-part-2

jobs:
  validate-project:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check src folder exists
        run: test -d src

      - name: Check docs folder exists
        run: test -d docs

      - name: Check SQL files exist
        run: find . -name "*.sql" | grep .sql

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install pytest

      - name: Run Python tests
        run: pytest
