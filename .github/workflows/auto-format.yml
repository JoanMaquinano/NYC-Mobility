name: Auto Format Source Files

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, develop, feature/staging-part-2]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-format:
    runs-on: ubuntu-latest
    name: Auto Format Code & SQL
    # Only run on PRs where we have write access
    if: github.event.pull_request.head.repo.full_name == github.repository
    
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Format Python files
        run: |
          python -m black src tests
          python -m isort src tests
      
      - name: Format Databricks SQL files
        run: python -m sqlfluff fix --config .sqlfluff src tests --force

      - name: Run SQLFluff fix
        run: |
          sqlfluff fix --dialect databricks . --force

      - name: Run black formatter
        run: |
          black . --line-length 120

      - name: Run isort
        run: |
          isort . --profile black

      - name: Commit changes if any
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: auto-format SQL, Python, and Jupyter notebooks'
          commit_options: '--no-verify'
          file_pattern: |
            src/**
            tests/**
          skip_fetch: false
          skip_checkout: false

      - name: Add PR comment about changes
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Auto-format workflow completed! Applied formatting with:\n- **sqlfluff** (Databricks dialect)\n- **black** (Python code & notebooks)\n- **isort** (Import sorting)\n- **nbstripout** (Jupyter notebook cleanup)\n\nIf changes were made, they have been automatically committed to this PR branch.'
            });
