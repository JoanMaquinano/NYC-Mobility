name: Auto Assign Reviewer

on:
  pull_request:
    types:
      - opened
      - ready_for_review

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  assign-reviewer:
    runs-on: ubuntu-latest

    steps:
      - name: Assign reviewer based on author
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const reviewerMap = {
              "jess-christine": ["catweyine"],
              "catweyine": ["jg0901"],
              "jg0901": ["go-viaaa"],
              "go-viaaa": ["JoanMaquinano"],
              "JoanMaquinano": ["jess-christine"]
            };

            const author = context.payload.pull_request.user.login;

            console.log(`Author: ${author}`);

            const reviewers = reviewerMap[author];

            console.log(`Reviewers: ${JSON.stringify(reviewers)}`);

            if (!reviewers) {
              console.log(`No reviewer configured for ${author}`);
              return;
            }

            await github.rest.pulls.requestReviewers({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              reviewers
            });

            console.log(`Assigned reviewers: ${reviewers.join(", ")}`);
