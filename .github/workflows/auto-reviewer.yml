name: Auto Assign Reviewer

on:
  pull_request:
    types:
      - opened
      - ready_for_review

jobs:
  assign-reviewer:
    runs-on: ubuntu-latest

    steps:
      - name: Assign reviewer based on author
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const reviewerMap = {
              "jess-christine": ["catweyine"],
              "catweyine": ["jg0901"],
              "jg0901": ["go-viaaa"],
              "go-viaaa": ["JoanMaquinano"],
              "JoanMaquinano": ["jess-christine"]
            };

            const author = context.payload.pull_request.user.login;
            const reviewers = reviewerMap[author];

            if (!reviewers) {
              core.info(`No reviewer configured for ${author}`);
              return;
            }

            await github.rest.pulls.requestReviewers({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              reviewers: reviewers
            });

            core.info(`Assigned reviewers: ${reviewers.join(", ")}`);
