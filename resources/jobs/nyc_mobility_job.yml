            python_file: /Workspace/Users/joan.maquinano@ftwfoundation.org/NYC-Mobility/tests/01_preload_source_check.py
          environment_key: Default
        - task_key: Green_Taxi_Bronze
          depends_on:
            - task_key: Preload_Checks
          sql_task:
            parameters:
              year_month: 2026-03
            file:
              path: /Workspace/Users/joan.maquinano@ftwfoundation.org/NYC-Mobility/src/green_taxi/bronze/01_ingest_green_taxi.sql
              source: WORKSPACE
            warehouse_id: 1c151e4beb523660
        - task_key: Taxi_Zones_Bronze
