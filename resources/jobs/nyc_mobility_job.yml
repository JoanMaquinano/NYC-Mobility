resources:
  jobs:
    NYC_Mobility:
      name: NYC Mobility

      tasks:
        - task_key: Preload_Checks
          spark_python_task:
            python_file: ../../tests/01_preload_source_check.py
          environment_key: Default

        - task_key: Green_Taxi_Bronze
          depends_on:
            - task_key: Preload_Checks
          sql_task:
            parameters:
              year_month: 2026-03
            file:
              path: ../../src/green_taxi/bronze/ingest_green_taxi.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}

        - task_key: Taxi_Zones_Bronze
          depends_on:
            - task_key: Preload_Checks
          sql_task:
            file:
              path: ../../src/taxi_zones/bronze/ingest_taxi_zones.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}

        - task_key: Weather_Bronze
          depends_on:
            - task_key: Preload_Checks
          sql_task:
            parameters:
              weather_file: weather_march_2026.csv
            file:
              path: ../../src/weather/bronze/bronze_weather.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}

        - task_key: Bronze_QC
          depends_on:
            - task_key: Weather_Bronze
            - task_key: Taxi_Zones_Bronze
            - task_key: Green_Taxi_Bronze
          sql_task:
            file:
              path: ../../tests/02_bronze_all_qc.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}

        - task_key: Green_Taxi_Silver
          depends_on:
            - task_key: Bronze_QC
          sql_task:
            file:
              path: ../../src/green_taxi/silver/green_taxi_clean.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}

        - task_key: Taxi_Zone_Silver
          depends_on:
            - task_key: Bronze_QC
          sql_task:
            file:
              path: ../../src/taxi_zones/silver/taxi_zones_clean.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}

        - task_key: Weather_Silver
          depends_on:
            - task_key: Bronze_QC
          sql_task:
            file:
              path: ../../src/weather/silver/weather_clean.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}

        - task_key: Silver_QC
          depends_on:
            - task_key: Taxi_Zone_Silver
            - task_key: Green_Taxi_Silver
            - task_key: Weather_Silver
          sql_task:
            file:
              path: ../../tests/03_silver_all_qc.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}

        - task_key: Dim_Date
          depends_on:
            - task_key: Silver_QC
          sql_task:
            file:
              path: ../../src/weather/gold/dim_date.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}

        - task_key: Dim_Taxi_Zone
          depends_on:
            - task_key: Silver_QC
          sql_task:
            file:
              path: ../../src/taxi_zones/gold/dim_taxi_zone.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}

        - task_key: Dim_Weather
          depends_on:
            - task_key: Silver_QC
          sql_task:
            file:
              path: ../../src/weather/gold/dim_weather.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}

        - task_key: Fact_Trip
          depends_on:
            - task_key: Silver_QC
          sql_task:
            file:
              path: ../../src/green_taxi/gold/fact_taxi_trip.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}

        - task_key: Gold_QC
          depends_on:
            - task_key: Dim_Weather
            - task_key: Dim_Taxi_Zone
            - task_key: Dim_Date
            - task_key: Fact_Trip
            - task_key: Silver_QC
          sql_task:
            file:
              path: ../../tests/04_gold_all_qc.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}

      queue:
        enabled: true

      parameters:
        - name: year_month
          default: 2026-03

      environments:
        - environment_key: Default
          spec:
            dependencies:
              - openmeteo-requests==1.7.5
              - requests-cache==1.3.3
              - retry-requests==2.0.0
            environment_version: "6"

      performance_target: PERFORMANCE_OPTIMIZED