      queue:
        enabled: true
      parameters:
        - name: year_month
          default: 2026-03
      environments:
        - environment_key: Default
          spec:
            dependencies:
              - openmeteo-requests==1.7.5
              - requests-cache==1.3.3
              - retry-requests==2.0.0
            environment_version: "6"
      performance_target: PERFORMANCE_OPTIMIZED
