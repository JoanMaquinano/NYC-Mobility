    - tests/**
    - docs/**

variables:
  cluster_id:
    description: Existing Databricks cluster used by the placeholder job.
    default: TODO_SET_CLUSTER_ID
  warehouse_id:
    description: SQL warehouse used by the NYC Mobility job tasks.
    lookup:
      warehouse: Serverless Starter Warehouse
