bundle:
  name: nyc_mobility

include:
  - resources/jobs/*.yml

sync:
  include:
    - src/**
    - tests/**
    - docs/**

variables:
  cluster_id:
    description: Databricks cluster ID
    default: ""

  warehouse_id:
    description: SQL Warehouse ID
    lookup:
      warehouse: Serverless Starter Warehouse

targets:
  dev:
    mode: development
    default: true

  prod:
    mode: production
    workspace:
      root_path: ~/.bundle/${bundle.name}/${bundle.target}
